[package]
name = "morph"
version = "0.1.0"
description = "Convert and edit files from a radial menu"
authors = ["Sreyash Singh"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "morph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native orb: CPU rendering (no GPU context, so nothing wakes the driver while idle).
tiny-skia = "0.11"
ab_glyph = "0.2"
# Image engine: only the formats Morph reads/writes, and no rayon (Morph controls its own threads).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico", "pnm"] }
# File type detection by magic bytes.
infer = "0.19"
# PDF merge/split/rotate/shrink in-process (MIT), so no qpdf to bundle.
lopdf = "0.38"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# The native orb's Linux presenter (`orb/gtk.rs`): the GTK 3 that Tauri already uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Native orb window on Windows (same version Tauri already pulls in).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # RegCreateKeyExW (right-click entry) takes SECURITY_ATTRIBUTES.
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # PDF → images with Windows' built-in renderer.
  "Win32_System_WinRT",
  "Data_Pdf",
  "Foundation",
  "Storage",
  "Storage_Streams",
] }
windows-core = "0.62"
windows-future = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Dev builds: optimise the dependencies (image codecs ran ~20x slower unoptimised,
# 23 s for a 12 MP JPG → PNG) but keep Morph's own code quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
