# Builds the installers when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0)
# and attaches them to a draft GitHub Release, to be checked and published by hand.
# Run by hand (Actions → release → Run workflow, or `gh workflow run release.yml`) it's a
# test build: no release, the installers are kept as the run's artifacts for 7 days.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest  # NSIS .exe + .msi
          - os: ubuntu-22.04    # AppImage + .deb + .rpm; the oldest glibc we support
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # LGPL FFmpeg only; the script refuses GPL/non-free builds (AGENTS.md rule 4).
      - name: Bundled FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Morph ${{ github.ref_name }}
          releaseBody: See the assets below for Windows and Linux installers.
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Test build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - name: Keep the test installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
