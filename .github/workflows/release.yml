# Builds the installers when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0)
# and attaches them to a draft GitHub Release, to be checked and published by hand.
# Run by hand (Actions → release → Run workflow, or `gh workflow run release.yml`) it's a
# test build: no release, the installers are kept as the run's artifacts for 7 days.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Test build only: build as this version (e.g. 0.1.1), to test updating"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest  # NSIS setup .exe
          - os: ubuntu-22.04    # AppImage + .deb + .rpm; the oldest glibc we support
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # LGPL FFmpeg only; the script refuses GPL/non-free builds (see THIRD_PARTY.md).
      - name: Bundled FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; the app checks them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Morph ${{ github.ref_name }}
          releaseBody: See the assets below for Windows and Linux installers.
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

      # Test builds only, never tagged releases: build as the given version, and let the
      # updater use an http:// address on this computer (MORPH_UPDATE_URL), for testing
      # updates without publishing a release. Downloads are still signature-checked.
      - name: Test build settings
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          node -e "
            const f = 'src-tauri/tauri.release.conf.json', fs = require('fs'), c = JSON.parse(fs.readFileSync(f));
            if (process.argv[1]) c.version = process.argv[1];
            c.plugins = { updater: { dangerousInsecureTransportProtocol: true } };
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          " "${{ inputs.version }}"
          cat src-tauri/tauri.release.conf.json

      - name: Test build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Keep the test installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}${{ inputs.version && format('-{0}', inputs.version) || '' }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
